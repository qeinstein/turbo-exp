[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-m-study"
version = "0.1.0"
description = "Falsification-oriented QJL sketch-dimension study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiment = ["torch>=2.4", "transformers>=4.40", "datasets>=2.18", "scipy>=1.10", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
